[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-app"
version = "0.1.0"
description = "Local demo foundation for a causal AI modernization project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.33,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
